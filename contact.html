<script src="./script/scriptMenu.js"></script>
<script>
  createNavbar();
    const navbarNav = document.getElementById('navbarNav1');
    let prevScrollPos = window.pageYOffset;

    window.onscroll = function() {
      const currentScrollPos = window.pageYOffset;
      if (prevScrollPos > currentScrollPos) {
        // เลื่อนขึ้น ทำให้ carousel ติด
        navbarNav.classList.add('navbarNav');
      } else {
        // เลื่อนลง ทำให้ carousel ไม่ติด
        navbarNav.classList.remove('navbarNav');
      }
      prevScrollPos = currentScrollPos;
    };

</script>
