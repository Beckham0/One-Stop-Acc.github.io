<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าเว็บตัวอย่าง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #007bff;
            color: white;
            padding: 20px;
            font-size: 24px;
        }
        .container {
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
        }

        #carousel_inner{
            transition:top 2s ease-in-out ;
            top: -2rem;
        }

        .fixed{
            top: 0 !important;
        }
    </style>
</head>
<body>
    <header>
        หน้าเว็บตัวอย่าง
    </header>
    <!-- <div class="container">
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของเราคนดี</h1>
        <p>นี่คือตัวอย่างหน้าเว็บ HTML ที่มีการตกแต่งด้วย CSS</p>id="carouselExampleAutoplaying"
    </div> -->

    <div id="carouselExampleFade" class="carousel slide carousel-fade">

        <div  class="carousel-inner" style="background: linear-gradient(to right,rgba(5, 56, 96, 0.61),rgb(23, 162, 194),rgb(5, 56, 96));height: 45vw;">
        <div id="carousel_inner" style=" background-image: url(./Sorce/22.png); width: 100%;height: 50vw;position: absolute;z-index: 2;background-size: cover;background-position: center;"></div>

          <div class="carousel-item active" style="display: grid;grid-template-columns: 2fr 1fr; height: 50vw; z-index: 4;">

            <div style="text-align: center;align-items: center;display: flex;justify-content: center;">
                <h1 style="color: aliceblue;font-size: 4rem;font-weight: bold;margin-bottom: 20%;">ONE STOP
                    ACCOUNTTING CO.,LTD</h1>

            </div>
            <img src="./Sorce/IMG_1441.PNG" class="d-block w-50 " alt="..." style="right: 0;position: absolute;bottom: 0;opacity: 0.9;z-index: 3;">
          </div>
          <div class="carousel-item" style="background-color: rgb(5, 56, 96);height: 50vw;">
            <img src="./Sorce/IMG_1449.JPG" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item" style="background-color: rgb(5, 56, 96);height: 50vw;">
            <img src="./Sorce/IMG_1447.JPG" class="d-block w-100" alt="...">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

    <footer>
        &copy; 2025 เว็บไซต์ตัวอย่าง. สงวนลิขสิทธิ์
    </footer>
</body>
<script>
    const carousel = document.getElementById('carousel_inner');
    let prevScrollPos = window.pageYOffset;

    window.onscroll = function() {
      const currentScrollPos = window.pageYOffset;

      if (prevScrollPos > currentScrollPos) {
        // เลื่อนขึ้น ทำให้ carousel ติด
        carousel.classList.add('fixed');
      } else {
        // เลื่อนลง ทำให้ carousel ไม่ติด
        carousel.classList.remove('fixed');
      }

      prevScrollPos = currentScrollPos;
    };
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
